spring:
  application:
    name: upload-server

grpc:
  server:
    port: 9090
    # TLS: scripts/gen-certs.sh 로 생성한 자체 서명 인증서. 파일이 없으면 기동 실패한다.
    security:
      enabled: true
      certificate-chain: file:certs/server.crt
      private-key: file:certs/server.key

upload:
  # 데모용 고정 인증 토큰. 서버/클라이언트가 같은 값을 공유해야 한다.
  auth:
    token: dev-secret-token
